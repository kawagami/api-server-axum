name: backend-ci

# PR 只跑 test（讓 Dependabot PR 有驗證）；build 與 deploy 只在 push master 跑。
# 兩者的區隔靠下方 job 的 `if: github.event_name == 'push'`，不可拿掉 ——
# 否則每個 PR 都會推 image 到 Docker Hub 並 SSH 部署到 VPS。
#
# test 與 build 刻意「不」相依（build job 是全新 runner + Docker 從頭編，用不到
# test job 的任何產物，`needs: test` 只是閘門）。閘門改掛在 deploy 的
# `needs: [test, build]`：測試沒過一樣不會部署，但兩個 job 並行省掉整個 test 的
# 時間（實測 206s → ~120s）。代價：測試失敗時 image 仍會被推上 Docker Hub，
# 所以 `:latest` 有可能指向沒過測試的 commit —— 手動 `docker pull :latest` 前要留意。
on:
  push:
    branches:
      - 'master'
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # repositories/redis.rs 的整合測試需要真實 Redis（權限快取 / OAuth state /
    # refresh token / WS ticket 都靠它，升 redis crate 時光看編譯過不夠）。
    # 版本與 production 的 deploy/docker-compose.yml 對齊。
    services:
      valkey:
        image: valkey/valkey:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
      # 設了這個，連不上 Redis 會讓測試 panic 而非靜默跳過（避免 service 掛掉卻假綠）
      REDIS_TEST_REQUIRED: "1"
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      -
        name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: backend
          # PR 不回存快取（post 步驟要 20~30s，而 PR 的 target dir 對 master 沒用）；
          # master 照存，下次 push 才有得 restore。
          save-if: ${{ github.ref == 'refs/heads/master' }}
      -
        name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      -
        name: Test
        run: cargo test --locked

  build:
    # 不掛 needs: test —— 與 test 並行，閘門在 deploy（理由見檔頭）
    if: github.event_name == 'push'   # PR 不推 image
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          push: true
          # :latest 供 docker-env 部署；:sha 供回滾（docker pull kawagami77/api-server:<sha>）
          tags: |
            kawagami77/api-server:latest
            kawagami77/api-server:${{ github.sha }}
          cache-from: type=registry,ref=kawagami77/api-server:buildcache
          cache-to: type=registry,ref=kawagami77/api-server:buildcache,mode=max

  deploy:
    needs: [test, build]   # 測試沒過不部署（build 並行故必須同時列 test）
    if: github.event_name == 'push'   # PR 不部署
    runs-on: ubuntu-latest
    # 與 frontend.yml 的 deploy job 共用 group：build 各自並行，只有部署階段序列化（排隊、不取消）
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    steps:
      -
        name: Update Vultr VPS Docker Service
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e   # 少了它，任何一步失敗都會被後面的指令蓋掉，job 照樣綠燈
            cd ~/kawa-deploy
            docker pull kawagami77/api-server:latest
            docker compose up -d --remove-orphans
            # nginx 的 proxy_pass 是靜態 hostname，只在載入設定時解析一次並永久快取 IP。
            # backend 容器 recreate 後 Docker 可能配到新 IP，不 reload 就會一直打舊 IP → 502
            # （最久要等 compose 裡那個 6h reload 循環才自癒）。reload 會重新解析 upstream 名稱。
            docker compose exec -T nginx nginx -s reload
            docker image prune --force
