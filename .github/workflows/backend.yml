name: backend-ci

# PR 只跑 test（讓 Dependabot PR 有驗證）；build 與 deploy 只在 push master 跑。
# 兩者的區隔靠下方 job 的 `if: github.event_name == 'push'`，不可拿掉 ——
# 否則每個 PR 都會推 image 到 Docker Hub 並 SSH 部署到 VPS。
on:
  push:
    branches:
      - 'master'
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      -
        name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: backend
      -
        name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      -
        name: Test
        run: cargo test --locked

  build:
    needs: test
    if: github.event_name == 'push'   # PR 不推 image
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          push: true
          # :latest 供 docker-env 部署；:sha 供回滾（docker pull kawagami77/api-server:<sha>）
          tags: |
            kawagami77/api-server:latest
            kawagami77/api-server:${{ github.sha }}
          cache-from: type=registry,ref=kawagami77/api-server:buildcache
          cache-to: type=registry,ref=kawagami77/api-server:buildcache,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push'   # PR 不部署
    runs-on: ubuntu-latest
    # 與 frontend.yml 的 deploy job 共用 group：build 各自並行，只有部署階段序列化（排隊、不取消）
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    steps:
      -
        name: Update Vultr VPS Docker Service
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/kawa-deploy
            docker pull kawagami77/api-server:latest
            docker compose up -d --remove-orphans
            docker image prune --force
