name: deploy-env

# 部署編排（compose / nginx）變更時同步到 VPS 並套用，不重 build image。
# 流程：staging 目錄驗證 → rsync 覆蓋 ~/kawa-deploy → compose up → nginx -t → reload

on:
  push:
    branches:
      - 'master'
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy.yml'

jobs:
  # PR 專用：在 runner 上把 nginx 設定完整跑一次 `nginx -t`。
  # 這裡不碰 VPS、不需要任何 secret，純語法/語意驗證。
  validate-nginx:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        # nginx -t 會檢查 ssl_certificate 指到的檔案存在，故先造一組拋棄式自簽憑證
        name: 產生自簽憑證供 nginx -t 使用
        run: |
          mkdir -p certs/live/kawa.homes
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout certs/live/kawa.homes/privkey.pem \
            -out   certs/live/kawa.homes/fullchain.pem \
            -subj "/CN=kawa.homes"
      -
        # --add-host 不可省：proxy_pass http://backend:3000 是靜態主機名，
        # nginx 在載入設定階段就會解析，runner 上沒有 compose 網路會 host not found。
        name: nginx -t
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --add-host frontend:127.0.0.1 \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$PWD/certs:/etc/letsencrypt:ro" \
            nginx:alpine nginx -t

  deploy:
    if: github.event_name == 'push'   # PR 不部署
    runs-on: ubuntu-latest
    # 與 backend.yml / frontend.yml 的 deploy job 共用 group，部署序列化
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        name: Clean staging dir
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: rm -rf ~/kawa-deploy-staging
      -
        name: Copy deploy config to staging
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy"
          target: "~/kawa-deploy-staging"
          strip_components: 1
      -
        name: Validate and apply
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            # 先驗證 staging 的 compose（env 檔在 /srv/kawa/env，VPS 上存在）
            docker compose -f ~/kawa-deploy-staging/docker-compose.yml config --quiet
            # 驗證通過才覆蓋正式目錄（--delete 清掉已移除的檔案）
            rsync -a --delete ~/kawa-deploy-staging/ ~/kawa-deploy/
            cd ~/kawa-deploy
            docker compose up -d --remove-orphans

            # ── nginx 設定驗證與套用 ───────────────────────────────────────────
            # ⚠ 不能用 `docker compose exec nginx nginx -t` 驗證。
            # nginx.conf 是「單一檔案」bind mount，綁的是 inode；rsync 是寫暫存檔再
            # rename，換掉了 inode，所以執行中的容器裡仍是舊的 nginx.conf
            # （conf.d 是目錄掛載，不受影響 —— 於是新舊混用，症狀是引用到未定義的
            #   shared memory zone 之類的假錯誤）。
            # 改用一次性容器掛載「當下磁碟上的檔案」來驗，才是真正要套用的那份。
            # --network 不可省：proxy_pass http://backend:3000 是靜態主機名，
            # nginx 在載入設定階段就會解析，不在 compose 網路上會 host not found。
            # 直接借用執行中 nginx 的 network namespace，免去猜 compose 網路名稱。
            docker run --rm \
              --network "container:nginx" \
              -v "$HOME/kawa-deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
              -v "$HOME/kawa-deploy/nginx/conf.d:/etc/nginx/conf.d:ro" \
              -v kawa_letsencrypt:/etc/letsencrypt:ro \
              nginx:alpine nginx -t

            # 驗證通過才重建 nginx 容器。必須 recreate 而非 reload/restart：
            # 只有重建才會重新解析 bind mount，拿到新的 nginx.conf inode。
            docker compose up -d --force-recreate --no-deps nginx

            # ── 冒煙檢查：確認重建後真的能服務 ───────────────────────────────
            # ⚠ 不要改回 `docker compose exec -T nginx nginx -t`。那行有三個問題：
            #   ① 資訊量為零 —— 上面那個一次性容器已經驗過同一份檔案；
            #   ② 對不上題 —— nginx -t 只驗語法，不發任何請求，證明不了「能服務」；
            #   ③ 有競態 —— 它對剛 force-recreate、才起來幾秒的容器 exec。
            #      2026-08-01 就在這裡拿到 exit 137 讓 job 紅掉，而站其實一直是好的
            #      （事後手動重跑同一行 exit=0、nginx 只吃 4.5MiB/64MiB、dmesg 無 OOM）。
            # 改成打真實請求：--resolve 讓 SNI 與憑證都對得上，走完整路徑
            # （TLS → vhost 匹配 → upstream → backend），並重試等剛重建的容器就緒。
            for i in $(seq 1 10); do
              if curl -fsS -o /dev/null --max-time 10 \
                   --resolve api.kawa.homes:443:127.0.0.1 \
                   https://api.kawa.homes/health; then
                echo "冒煙檢查通過（第 $i 次嘗試）"
                exit 0
              fi
              echo "第 $i 次未通過，3 秒後重試"
              sleep 3
            done
            echo "冒煙檢查失敗：nginx 重建後 https://api.kawa.homes/health 打不通"
            exit 1
