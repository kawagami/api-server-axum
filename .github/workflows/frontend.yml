name: frontend-ci

# PR 只跑 test（讓 Dependabot PR 有驗證）；build 與 deploy 只在 push master 跑。
# 兩者的區隔靠下方 job 的 `if: github.event_name == 'push'`，不可拿掉 ——
# 否則每個 PR 都會推 image 到 Docker Hub 並 SSH 部署到 VPS。
on:
  push:
    branches:
      - 'master'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      -
        name: Enable corepack (pnpm 版本由 package.json packageManager 釘住)
        run: corepack enable
      -
        name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      -
        name: Install dependencies
        run: pnpm install --frozen-lockfile
      -
        name: Type check
        run: pnpm exec tsc --noEmit

  build:
    needs: test
    if: github.event_name == 'push'   # PR 不推 image
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./frontend
          push: true
          # :latest 供 docker-env 部署；:sha 供回滾（docker pull kawagami77/my-next-blog:<sha>）
          tags: |
            kawagami77/my-next-blog:latest
            kawagami77/my-next-blog:${{ github.sha }}
          cache-from: type=registry,ref=kawagami77/my-next-blog:buildcache
          cache-to: type=registry,ref=kawagami77/my-next-blog:buildcache,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push'   # PR 不部署
    runs-on: ubuntu-latest
    # 與 backend.yml 的 deploy job 共用 group：build 各自並行，只有部署階段序列化（排隊、不取消）
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    steps:
      -
        name: Update Vultr VPS Docker Service
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/kawa-deploy
            docker pull kawagami77/my-next-blog:latest
            docker compose up -d --remove-orphans
            docker image prune --force
