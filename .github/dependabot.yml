# Dependabot — 依賴自動跟版
#
# 為什麼需要：workflow 的 action 已改為釘 commit SHA（防 tag 被上游改寫的供應鏈攻擊），
# 但釘死就不會自動拿到修補。Dependabot 認得 `@<sha> # v7` 這種寫法，
# 會同時更新 SHA 與後面的版本註解，等於「釘死」與「跟得上」兼得。
#
# Dependabot 只開 PR，不會直接動 master。PR 會觸發三個 workflow 的驗證 job
# （backend/frontend 的 test、deploy 的 validate-nginx），但 build 與 deploy 都被
# `if: github.event_name == 'push'` 擋在 master 之外 —— 所以 PR 不推 image、不碰 VPS，
# 你 review、merge 之後才會走正常的部署流程。
#
# ⚠ test 綠燈不等於改動安全：Dependabot 只改版號，不會補新版要求的 feature。
# 2026-08-02 的 jsonwebtoken 9→11 就是實例 —— 少挑 crypto backend 能編過、
# clippy 過、既有測試全過，卻在真的簽 JWT 時才 panic（那條路徑上是全站認證）。
# 現在有 `services/auth.rs` 的 jwt_crypto_provider 測試守著這一格，
# 但同類陷阱（跨大版改 feature 語意）還會出現在別的 crate，major PR 一律自己驗過再合。
#
# ⚠ 第二種靜默失敗:**群組 PR 開出來不代表成員到齊**（dependabot 對某個包報錯時，
# 它照樣把其餘的送進 PR，少的那個看起來就像「沒新版」）。實例與檢查方式見下面
# npm 那段 `prod-minor-patch` 的註解。

version: 2
updates:
  # ── GitHub Actions（供應鏈風險最高：這些 job 手上有 SSH_PRIVATE_KEY 與 DOCKERHUB_TOKEN）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # 同樣只群組 minor/patch；major 單獨開 PR，才看得到是哪個 action 跳大版
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── 前端 npm/pnpm
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node 的主版該跟 runtime 的 Node 走（Dockerfile + CI setup-node，現為 24 LTS），
      # 不是有新版就跟 —— 跟過頭會拿到 runtime 根本沒有的 API 型別。
      # 升 Node LTS 時三處一起手動改（Dockerfile / workflow / 這裡）。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # 開發期依賴（eslint / 型別 / tailwind 等）合併成一個 PR，減少噪音。
      # ⚠ update-types 不可省：少了它，major 也會被掃進這個群組而「看起來只是例行更新」。
      # 2026-07-25 就發生過 —— 一個標題寫 dev-dependencies 的 PR 裡包了
      # eslint 9→10（本專案明確釘 v9，eslint-config-next 尚不相容 v10）、
      # tailwindcss 3→4（v4 廢掉 tailwind.config.js，會讓整套主題 CSS variables 崩）、
      # typescript 6→7。major 一律單獨開 PR，才擋得掉。
      dev-dependencies:
        dependency-type: development
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # 生產依賴分開，方便逐一評估（next / react / sharp 這類要看 release note）
      #
      # ⚠ **群組 PR 開出來，不代表群組成員到齊。** 少一個成員長得跟「那個包沒新版」
      # 一模一樣 —— 沒有紅燈、沒有警告、PR 標題照樣寫 3 updates。
      #
      # 2026-08-24 的實例:`next` 在這個群組裡，但 dependabot 對它報
      #   | next | unknown_error | null |
      # 於是 #37 只帶了 lucide-react / next-intl / uuid 三個，而 **next 16.3.2 早在
      # 08-21 就發了**（#37 是 08-22 開的，時間上本來就該包進去）。同一個錯誤前一次
      # 被「PR 照樣開出來」蓋掉，第二次才因為沒別的事可做而把整個 update job 判紅。
      #
      # 確認過**不是**相依衝突:本機 `corepack pnpm up next@^16.3.2` 一次乾淨過，
      # 沒有任何 peer 問題。是它的 npm updater 自己掛，這個 repo 解得開。
      #
      # ⇒ **看到這個群組的 PR 時，先在 frontend/ 跑一次:**
      #       corepack pnpm outdated
      #   它列出「所有」落後的包，所以不只擋 next 這一格 —— 任何被 dependabot 靜默跳過
      #   的成員都會現形。輸出空的才代表群組真的到齊了。
      #   單包點名用 `corepack pnpm view <pkg> version`（本機沒有 jq，別寫 curl+jq 的招）。
      #   要補 next 就跟 eslint-config-next **一起**升，免得版本歪掉。
      #   ⚠ 一律用 `corepack pnpm` 而不是裸 pnpm:package.json 的 packageManager 釘 10.x，
      #   版本不同會寫出 CI `--frozen-lockfile` 讀不了的 lock。
      prod-minor-patch:
        dependency-type: production
        update-types: ["minor", "patch"]

  # ── 後端 Rust
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # ── Docker base image（builder 與 runtime 基底）
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # node 的主版只跟 LTS（偶數版）。dependabot 認得的是「有沒有新 tag」，
      # 不認得 25 是 Current、生產不該用，所以奇偶要靠這條擋。
      # Node 26 進 LTS（2026-10）時把 Dockerfile、CI setup-node 一起手動升。
      - dependency-name: node
        update-types: ["version-update:semver-major"]
