# 反向代理共用基礎設施：upstream 連線池 + WebSocket 用的 Connection 值
#
# ── map $connection_upgrade ────────────────────────────────────────────────
# 原本 api vhost 在 location / 硬寫 Connection "upgrade"，等於每一個普通 REST
# 請求都帶著 upgrade 語意去打後端，也讓 upstream keepalive 不可能成立
# （Connection 是 hop-by-hop，寫死 upgrade 就等於每次都要求換協議）。
#
# 改用 map 之後：WS 請求送 Connection: upgrade，其餘送空字串 —— nginx 對空值
# header 直接不送出，正是官方 keepalive 要求的 proxy_set_header Connection ""。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ── upstream 連線池 ────────────────────────────────────────────────────────
# 沒有 upstream block 時，每個請求都對後端新開一條 TCP；1 核機器上這是白花的
# syscall。keepalive N 是「每個 worker 保留的閒置連線數」，不是連線數上限。
#
# ⚠ 這不會改變「換 image 後要 reload nginx」的需求：hostname 一樣是啟動 /
#   reload 時解析一次，容器重建拿到新 IP 後舊值照樣過期。
#
# ⚠ 用了 upstream block 之後 $proxy_host 會變成這裡的名稱（frontend_app），
#   不再是 frontend:3000。原本靠 Host 預設值 = $proxy_host 來釘死內網值的地方
#   語意會跟著變，故在 kawa.homes.conf 改成明寫，見該檔註解。
#
# ⚠ 下面兩個 3000 是**寫死的內網約定**，nginx 讀不到 env。要換 port 的話
#   backend 側要同時改：kawa.env 的 API_URL、backend 的 APP_PORT；
#   frontend 側要同時改：frontend/Dockerfile 的 ENV PORT、kawa.homes.conf 的
#   proxy_set_header Host "frontend:3000"。少改一處就是 502，所以除非真的撞埠，
#   維持 3000 不動。
upstream backend_app {
    server backend:3000;
    keepalive 32;
}

upstream frontend_app {
    server frontend:3000;
    keepalive 16;
}
