# 反向代理共用基礎設施：upstream 連線池 + WebSocket 用的 Connection 值
#
# ── map $connection_upgrade ────────────────────────────────────────────────
# 原本 api vhost 在 location / 硬寫 Connection "upgrade"，等於每一個普通 REST
# 請求都帶著 upgrade 語意去打後端，也讓 upstream keepalive 不可能成立
# （Connection 是 hop-by-hop，寫死 upgrade 就等於每次都要求換協議）。
#
# 改用 map 之後：WS 請求送 Connection: upgrade，其餘送空字串 —— nginx 對空值
# header 直接不送出，正是官方 keepalive 要求的 proxy_set_header Connection ""。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ── upstream 連線池 ────────────────────────────────────────────────────────
# 沒有 upstream block 時，每個請求都對後端新開一條 TCP；1 核機器上這是白花的
# syscall。keepalive N 是「每個 worker 保留的閒置連線數」，不是連線數上限。
#
# ⚠ 這不會改變「換 image 後要 reload nginx」的需求：hostname 一樣是啟動 /
#   reload 時解析一次，容器重建拿到新 IP 後舊值照樣過期。
#
# ⚠ 用了 upstream block 之後 $proxy_host 會變成這裡的名稱（frontend_app），
#   不再是 frontend:3000。原本靠 Host 預設值 = $proxy_host 來釘死內網值的地方
#   語意會跟著變，故在 kawa.homes.conf 改成明寫，見該檔註解。
#
# ⚠ 下面兩個 3000 是**寫死的內網約定**，nginx 讀不到 env。要換 port 的話
#   backend 側要同時改：kawa.env 的 API_URL、backend 的 APP_PORT；
#   frontend 側要同時改：frontend/Dockerfile 的 ENV PORT、kawa.homes.conf 的
#   proxy_set_header Host "frontend:3000"。少改一處就是 502，所以除非真的撞埠，
#   維持 3000 不動。
upstream backend_app {
    server backend:3000;
    keepalive 32;
}

upstream frontend_app {
    server frontend:3000;
    keepalive 16;
}

# ── 匿名公開 API 的快取（api.kawa.homes 的 /blogs）────────────────────────
# 為什麼需要：前端 SSR 讀 blog 走的是 Next Data Cache（frontend/api/blogs.ts 的
# `revalidate`），但那條打的是內網 http://backend:3000，**完全不經 nginx** —— 對
# 「拿 origin IP 直接洪水打 api.kawa.homes」這個情境毫無幫助。這裡是那個情境下
# PG（384m、與全站共用 1 核、pool 只有 20 條）唯一的緩衝。
#
# 位置在容器 fs（非 volume），部署重建就清空 —— 這是刻意的：快取沒有任何需要保存的
# 東西，而多一個 volume 就多一個要備份/清理的狀態。冷啟動的代價是幾個 cache miss。
#
# keys_zone 4m ≈ 3 萬個 key，對個人站的文章數綽綽有餘；共享記憶體算在 nginx 容器的
# mem_limit 64m 裡（穩態實測 7.1M），所以刻意不開大。
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:4m max_size=32m inactive=10m use_temp_path=off;

# 帶任何認證資訊就完全不碰快取（既不讀也不寫）。
# 兩個 header 串起來判斷是為了「有一個就算」—— nginx 的 map 沒有 OR，但空字串相接
# 仍是空字串，正好表達「兩個都沒有」。
map $http_authorization$http_cookie $api_cache_private {
    default 1;
    ''      0;
}

# 關鍵字搜尋不進快取。理由不是安全而是**別讓快取被沖掉**：`?q=` 的值可以任意變化，
# 每個都存一份會把真正有用的熱門條目擠出 LRU，而攻擊者送的隨機 q 本來就永遠 miss。
# 搜尋本身的成本由 backend 的 services::blogs::MAX_SEARCH_LEN 與 markdown 的
# pg_trgm 索引擋（migration 20260827000000）。
map $arg_q $api_cache_search {
    default 1;
    ''      0;
}
