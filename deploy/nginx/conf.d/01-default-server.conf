# Catch-all：Host / SNI 對不上任何 vhost 的請求一律拒絕
#
# 沒有這個檔的話，nginx 會把「載入順序第一個」server block（字母序 = api.kawa.homes.conf）
# 當成 default_server，結果是任何亂送 Host 的請求都落到 Rust 後端。
# 加上明確的 default_server 後，未知 Host 在 nginx 就被斷掉，不會進到任何 upstream。
#
# 註：CF 只會轉發它 DNS 上有的 hostname，所以這道防線主要防的是
# 「知道 origin IP、繞過 CF 直接打 443」的情境。
#
# 檔名 01- 只為閱讀時一眼看出載入順序；default_server 是明確旗標，實際不依賴檔名排序。
#
# ── 為什麼全站沒有 `listen [::]`（2026-08-09 移除）─────────────────────────────
# 這台 VPS **從來沒有可用的 IPv6**：`ip -6 addr` 只有 link-local `fe80::`，`ip -6 route`
# 沒有 `::/0` 預設路由。但 IPv6 stack 是開著的，於是 glibc / Go 都以為「有 IPv6」，
# 對外連線先試 AAAA 再撞牆 —— backend 的 Google 登入（`EADDRNOTAVAIL`）、寄信、
# 甚至 docker daemon 自己 pull image（`network is unreachable`）都中過。
#
# 修法是在**宿主機**關掉 IPv6（`/etc/sysctl.d/99-disable-ipv6.conf`）。一旦關掉，
# 容器 netns 也不會有 IPv6，`listen [::]:80` 會變成
#   `socket() [::]:80 failed (97: Address family not supported by protocol)`
# → **nginx 起不來 = 全站掛掉**。所以這幾行必須先拆，順序不能反。
#
# 對外服務不受影響：DNS 上沒有 AAAA（本來就沒有全域 v6 位址），Cloudflare 一律走 v4 回源。
# 哪天真的把 IPv6 設起來，再把 `listen [::]:…` 加回來（連同 DNS 的 AAAA）。

server {
    listen       80 default_server;
    server_name  _;
    return 444;   # 不回應、直接斷連
}

server {
    listen       443 ssl default_server;
    server_name  _;

    # 未知 SNI 直接在 TLS 交握階段拒絕，不需要也不出示任何憑證
    # （nginx >= 1.19.4；官方 nginx:alpine 遠高於此）
    ssl_reject_handshake on;

    # ssl_reject_handshake 只管 SNI。「SNI 給正確網域、Host header 卻是別的」
    # 這種組合交握會成功，然後才因為 Host 對不上而落到本 block —— 少了下面這行
    # 會回一個 nginx 預設 404 頁，與上面「直接斷連」的意圖不一致（不進 upstream
    # 這點兩者相同，純粹是別多給對方一個可探測的回應）。
    return 444;
}
