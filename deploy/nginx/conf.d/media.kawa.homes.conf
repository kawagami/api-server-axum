# media.kawa.homes — 上傳媒體公開網域
# 直接從本地磁碟 /srv/kawa/uploads 靜態服務(不經 backend),與儲存後端解耦。
# 精確 server_name 優先於 kawa.homes.conf 的 *.kawa.homes wildcard,不會被導到前端。
# TLS 沿用 kawa.homes wildcard 憑證(涵蓋 *.kawa.homes)。
server {
    listen       80;
    listen  [::]:80;
    server_name  media.kawa.homes;
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    http2 on;
    server_name  media.kawa.homes;

    ssl_certificate     /etc/letsencrypt/live/kawa.homes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kawa.homes/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 檔案以 <uuid>.<ext> 平放在 uploads 根目錄,內容不可變,可長期強快取
    location / {
        limit_req zone=general burst=200 nodelay;   # 一頁可能載入大量圖，burst 給得比其他 vhost 寬

        root /srv/kawa/uploads;
        access_log off;

        # ⚠ 這一組 add_header 必須完整重列。
        # nginx 的 add_header 是「子層有就整組覆蓋父層」而非累加 —— 原本這裡只有
        # Cache-Control 一行，等於把 server 層的 HSTS 靜默掉了，media 網域一直沒送 HSTS。
        #
        # max-age 直接寫進這一行，不另外用 expires 1y：expires 自己也會產生一個
        # Cache-Control，而 add_header 是「再加一個」不是覆蓋，兩者並存會送出
        # 兩行 Cache-Control。瀏覽器多半按 comma-join 解讀，但中間層行為不保證。
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # 本網域直出使用者上傳的檔案，nosniff 在這裡最要緊：
        # 禁止瀏覽器忽略 Content-Type 去猜內容而把檔案當成 HTML/JS 執行。
        # （後端已一律 decode 後重編成 WebP，存不進 SVG/HTML，這是第二層。）
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
