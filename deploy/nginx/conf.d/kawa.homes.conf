# 刻意沒有 `listen [::]`：這台 VPS 沒有可用的 IPv6，且宿主機已整台關閉 —— 理由見 01-default-server.conf
server {
    listen       80;
    server_name  kawa.homes *.kawa.homes;
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    http2 on;
    server_name  kawa.homes *.kawa.homes;

    ssl_certificate     /etc/letsencrypt/live/kawa.homes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kawa.homes/privkey.pem;

    # 注意 nginx 的 add_header 繼承規則：子層只要出現任何一個 add_header，
    # 就會整組覆蓋掉父層的。本 vhost 的 location 沒有自己的 add_header，故可安全繼承。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # ⚠ proxy_set_header 跟 add_header 一樣是「子層有就整組覆蓋父層」。全部集中在
    #   server 層、location 一個都不寫，就不會有覆蓋問題。
    proxy_http_version 1.1;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Upgrade $http_upgrade;

    # Host 刻意釘死在內網值，不送訪客的 $host：
    # 訪客送來的 Host 到不了 Next.js，正是 Host header 類攻擊（如 CVE-2026-64649）
    # 想要的那個輸入被切斷的狀態。
    # 原本這是靠「不寫 proxy_set_header Host、吃 nginx 預設值 $proxy_host」達成的；
    # 改用 upstream block 後 $proxy_host 會變成 upstream 名稱 frontend_app，
    # 效果雖然一樣（都是無意義的內網值），但語意不再明顯，故在此明寫。
    proxy_set_header Host "frontend:3000";

    # 見 api.kawa.homes.conf 同一組 header 的說明：不覆寫的話，繞過 CF 直連者
    # 可以自由偽造來源 IP。前端目前不讀這些 header，但不能靠「現在沒讀」當防線。
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For  $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 認證嘗試類端點單獨限流，與 api.kawa.homes 的 /admin/auth 共用同一個 auth zone。
    # 沒有這兩條的話，攻擊者走 kawa.homes/api/auth/login 命中的是下面 location / 的
    # general(30r/s)，等於整條 10r/m 的門檻被繞過。
    #
    # ⚠ 刻意逐一列出「猜憑證」的端點，**不要**用 `location /api/auth/` 一次涵蓋：
    #   /api/auth/refresh   由 libs/token-refresh.ts 定期呼叫
    #   /api/auth/ws-ticket 每次 WS 重連都會打
    #   這兩支套上 10r/m 會直接壞掉。
    # ⚠ 這兩個 location 都沒有自己的 add_header / proxy_set_header，故安全繼承
    #   server 層那兩組（見本檔開頭的說明）；日後要在此加任何一個，必須整組重列。
    location = /api/auth/login {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://frontend_app;
    }

    location /api/auth/passkey/login/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://frontend_app;
    }

    location / {
        limit_req zone=general burst=100 nodelay;

        proxy_pass http://frontend_app;
    }
}
