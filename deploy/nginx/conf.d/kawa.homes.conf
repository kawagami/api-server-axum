server {
    listen       80;
    listen  [::]:80;
    server_name  kawa.homes *.kawa.homes;
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    http2 on;
    server_name  kawa.homes *.kawa.homes;

    ssl_certificate     /etc/letsencrypt/live/kawa.homes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kawa.homes/privkey.pem;

    # 注意 nginx 的 add_header 繼承規則：子層只要出現任何一個 add_header，
    # 就會整組覆蓋掉父層的。本 vhost 的 location 沒有自己的 add_header，故可安全繼承。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        limit_req zone=general burst=100 nodelay;

        proxy_pass http://frontend:3000;

        # 這裡刻意不設 proxy_set_header Host：
        # nginx 預設會送 Host: $proxy_host（即 frontend:3000），等於把 host 釘死在內網值，
        # 訪客送來的 Host 到不了 Next.js。這正是 Host header 類攻擊（如 CVE-2026-64649）
        # 想要的那個輸入被切斷的狀態，故維持現狀不改。
    }
}
