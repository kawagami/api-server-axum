# api.kawa.homes — 後端 API / WS 公開網域
# axum.kawa.homes 是舊名，保留為 alias。2026-07-28 的 media_domain_backfill
# migration 已把 DB 內所有存量圖片 URL 改成 media.kawa.homes，站內不再產出也不再
# 引用舊網域；alias 留著只為了 repo 外那些改不到的引用（搜尋引擎圖片索引、他站
# hotlink、RSS reader 快取、貼到別處的連結），以及還在打舊網域的 API 客戶端。
# 刻意沒有 `listen [::]`：這台 VPS 沒有可用的 IPv6，且宿主機已整台關閉 —— 理由見 01-default-server.conf
server {
    listen       80;
    server_name  api.kawa.homes axum.kawa.homes;
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    http2 on;
    server_name  api.kawa.homes axum.kawa.homes;

    ssl_certificate     /etc/letsencrypt/live/kawa.homes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kawa.homes/privkey.pem;

    # nginx 的 add_header 是「子層有就整組覆蓋父層」，不是累加。
    # 下面的 proxy location 都沒有自己的 add_header，故安全繼承這三行；日後要在
    # location 內加任何 add_header，必須把這三行一併重列，否則會靜默掉光。
    # （/uploads 就是這種情況，見該 location。）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 共用 proxy header ──────────────────────────────────────────────────
    # ⚠ proxy_set_header 跟 add_header 同樣是「子層有就整組覆蓋父層」。這些刻意
    #   全部集中在 server 層、底下每個 location 一個都不寫，就不會有覆蓋問題；
    #   哪天真的要在某個 location 加，必須把這整組重列。
    proxy_http_version 1.1;
    proxy_set_header Host $host;              # passkey 的 RP ID / OAuth redirect 需要真實 host
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Upgrade $http_upgrade;

    # ⚠ 這行是安全邊界，不是效能設定，不要拿掉。
    # 生產是 TRUST_CF_HEADER=true，後端 middleware/rate_limit.rs 與 routes/ws.rs
    # 都拿 CF-Connecting-IP 當真實 IP。若原封轉發訪客送來的值，任何知道 origin IP
    # 而繞過 CF 直打 443 的人，只要每個請求換一個假 IP 就能：
    #   1. 完全繞過後端 Redis 的 per-IP rate limit
    #   2. 在 audit log / 觀測頁的 real_ip 灌任意值
    # $remote_addr 已由 00-cloudflare-realip.conf 還原，且只對 CF 網段生效 ——
    # 所以這行對正常 CF 流量是 no-op，對直連者則換成他自己的真實 IP。
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For  $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 舊網域的圖片路徑：DB 回填後站內已無引用，這裡只接 repo 外殘留的舊連結，
    # 一律 301 到 media 網域（同一個磁碟檔案，檔名不變）。
    # 這裡不再掛 alias —— 圖片的唯一真實服務點是 media.kawa.homes.conf。
    # 檔名是 <uuid>.<ext>，命中率低到不需要 limit_req 之外的優化。
    location ~ ^/uploads/(.*)$ {
        limit_req zone=general burst=200 nodelay;   # 一頁可能載入大量圖，比照 media vhost

        return 301 https://media.kawa.homes/$1;
    }

    # 登入類端點單獨嚴格限流。前綴涵蓋 /admin/auth（密碼登入）、
    # /admin/auth/passkeys/login/{begin,finish}（WebAuthn 挑戰）與 /admin/auth/refresh。
    # 這些路徑走 bcrypt / 加密運算，1 核機器上單價很高 ——
    # 暴力嘗試同時是帳密爆破與 CPU DoS，兩件事一起擋。
    location /admin/auth {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://backend_app;
    }

    # 會員側的登入路徑，同樣可爆破，原本卻只有 general 的 30r/s：
    #   /oauth/{provider}/exchange  用授權碼換 token
    #   /oauth/refresh              換新 access token
    # GET /oauth/{provider}（取授權 URL）順帶一起限，正常一次登入只打一兩次。
    # burst 給到 10 是留給 NAT 後多人共用同一個出口 IP 的情況。
    location /oauth/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://backend_app;
    }

    # 公開 blog API：唯一開快取的 location。
    #
    # ⚠ **刻意不在 server 層開 proxy_cache**，即使那樣少寫幾行。這個 vhost 上有
    #   `GET /tools/new_password` —— 無認證、無 cookie、每次回不同的隨機密碼。
    #   全域開快取的話所有人會在 60 秒內拿到同一組密碼。開快取一律 opt-in 到單一 location。
    #
    # ⚠ **沒有 `proxy_cache_valid 200`,這是刻意的**：於是「能不能快取」的唯一決定權在
    #   backend 送不送 `Cache-Control`（`routes.rs` 的 `public_cache()`，s-maxage=60）。
    #   沒掛那個標頭的端點（例如 `GET /blogs/{id}/comments` —— 訪客留完言會立刻重讀）
    #   就自動不會被快取，不必在這裡另外維護一份路徑排除清單。
    #
    # ⚠ 快取只吃得到「重複的匿名 GET」。攻擊者要製造 miss 很容易（換 `?q=`、換 Origin ——
    #   後端 CORS 會送 `Vary: origin`，nginx 照 Vary 分變體）。這一層擋的是**流量放大與
    #   正常尖峰**，不是有針對性的攻擊；後者的正解仍是「防火牆只放行 CF 網段」。
    location /blogs {
        limit_req zone=general burst=100 nodelay;
        # 搜尋專屬額度（只在帶 ?q= 時計數，定義見 nginx.conf 的 search zone）。
        # 兩條 limit_req 是疊加的：一般瀏覽只受 general 管，搜尋兩條都要過。
        limit_req zone=search  burst=5   nodelay;

        proxy_cache api_cache;
        proxy_cache_key "$scheme$host$request_uri";
        # 帶認證資訊或帶 ?q= 一律繞過（定義見 02-proxy.conf）。兩個指令都要下：
        # bypass 管「不讀快取」，no_cache 管「不寫快取」，少一個就會有一邊漏掉。
        proxy_cache_bypass $api_cache_private $api_cache_search;
        proxy_no_cache     $api_cache_private $api_cache_search;
        # 404 沒有 Cache-Control，靠這行短暫收斂「亂猜 uuid」的洪水
        proxy_cache_valid 404 10s;
        # 同一個 key 同時 miss 時只放一個請求去後端，其餘等它 —— 正是被打時最需要的行為
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        # 後端掛掉或逾時仍送舊資料：blog 是唯讀內容，過期的版本遠好過 502
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        # ⚠ 這一組 add_header 必須完整重列 —— nginx 的 add_header 是「子層有就整組覆蓋
        #   父層」而非累加。只寫 X-Cache-Status 的話，本 server 開頭那三行（HSTS /
        #   nosniff / Referrer-Policy）會在這個 location 上靜默消失。
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_pass http://backend_app;
    }

    # WebSocket。後端每 30s 主動送 Ping（routes/ws.rs 的 PING_INTERVAL_SECONDS），
    # 剛好壓在 proxy_read_timeout 預設 60s 底下 —— 也就是說連線不斷是靠那個常數
    # 撐著的，改大就會變成隨機斷線。明寫一個長 timeout 把這個隱含耦合切掉。
    location /ws {
        limit_req zone=general burst=100 nodelay;

        proxy_pass http://backend_app;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=general burst=100 nodelay;

        proxy_pass http://backend_app;
        proxy_buffering off;            # 大檔直接流給 client，不落地 temp
        proxy_request_buffering off;
    }
}
