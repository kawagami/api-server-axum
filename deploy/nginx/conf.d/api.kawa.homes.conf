# api.kawa.homes — 後端 API / WS 公開網域
# axum.kawa.homes 是舊名，永久保留為 alias：存量 blog 內容硬編了
# https://axum.kawa.homes/uploads/... 的圖片 URL，不能轉址也不能下線
server {
    listen       80;
    listen  [::]:80;
    server_name  api.kawa.homes axum.kawa.homes;
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    http2 on;
    server_name  api.kawa.homes axum.kawa.homes;

    ssl_certificate     /etc/letsencrypt/live/kawa.homes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kawa.homes/privkey.pem;

    # nginx 的 add_header 是「子層有就整組覆蓋父層」，不是累加。
    # 下面兩個 location 都沒有自己的 add_header，故安全繼承這三行；日後要在 location
    # 內加任何 add_header，必須把這三行一併重列，否則會靜默掉光。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 登入類端點單獨嚴格限流。前綴涵蓋 /admin/auth（密碼登入）、
    # /admin/auth/passkeys/login/{begin,finish}（WebAuthn 挑戰）與 /admin/auth/refresh。
    # 這些路徑走 bcrypt / 加密運算，1 核機器上單價很高 ——
    # 暴力嘗試同時是帳密爆破與 CPU DoS，兩件事一起擋。
    location /admin/auth {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        limit_req zone=general burst=100 nodelay;

        proxy_pass http://backend:3000;
        proxy_buffering off;            # 大檔直接流給 client，不落地 temp
        proxy_request_buffering off;

        # ws 協議
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
