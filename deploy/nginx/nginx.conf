
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Server header 與錯誤頁不出示 nginx 版本號
    server_tokens off;

    # 必須與後端 routes.rs 的 RequestBodyLimitLayer(10 * 1024 * 1024) 相等。
    # 曾經一邊是 binary(10m=10485760)、一邊是 decimal(10*1000*1000)，中間那 48 萬
    # bytes 會由 nginx 依 Content-Length 放行、後端才 413 —— 而 api vhost 開了
    # proxy_request_buffering off，client 端看到的是上傳到一半斷掉，跟 CF 的
    # QUIC 上傳卡死幾乎無法區分，排查會很痛。改哪邊都要同時改另一邊。
    client_max_body_size 10m;

    # slowloris 類的慢速連線耗盡：limit_req 按請求數計，擋不到「連線開著、
    # 幾乎不送資料」這種打法。1 核機器沒有 worker 可以浪費，把預設 60s 的
    # 耐心收短。三個都是「兩次讀/寫之間」的間隔而非總時長，故不會誤殺慢速大檔。
    #
    # 註：這裡刻意不加 limit_conn。CF 到 origin 走 HTTP/2 並複用連線，
    #     而 $binary_remote_addr 是 per-request 由 real_ip 還原的訪客 IP，
    #     兩者對不起來，按連線計數會得到難以預期的結果。
    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          30s;
    reset_timedout_connection on;

    # Rate limiting。key 是 $binary_remote_addr，其真實性依賴 conf.d/00-cloudflare-realip.conf
    # 還原出訪客 IP —— 少了那份設定，這裡等於按 CF 節點計費，會誤殺正常流量。
    #
    # general：一般瀏覽。一次頁面載入會併發數十個請求，故 rate 給寬、burst 給大，
    #          只擋明顯洪水，不影響正常使用。
    # auth   ：登入類端點。bcrypt 驗證在 1 核機器上很貴，暴力嘗試同時是爆破與 DoS。
    # search ：blog 關鍵字搜尋。實測(2026-08-27,2000 篇 / 3MB 表)一個命中大量文章的
    #          常見詞要 ~28ms,而列表端點的 count 那半邊**無法靠 LIMIT 提早結束** ——
    #          一個請求 count + list 併發兩份 ≈ 60ms 的 PG CPU。general 的 30r/s 放進來
    #          就是單核直接吃滿,pg_trgm 索引也救不了(row 真的全中,索引只是換個路徑取)。
    #
    #          key 用下面的 map:沒有 `?q=` 時 key 是空字串,limit_req 對空 key 不計數,
    #          所以同一條指令只對搜尋請求生效,一般列表瀏覽完全不受影響。
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
    limit_req_zone $search_limit_key   zone=search:5m   rate=20r/m;
    limit_req_status 429;

    # 見上面 search zone 的說明。空 key ＝ 不計數。
    # ⚠ 這個 map 只看「有沒有 q=」，不看路徑，所以任何帶 `q=` 的網址都會被算成搜尋。
    #   Next.js 的 `/_next/image?…&q=75`(畫質參數)就中過:圖多的 blog 一次併發十幾張，
    #   第 7 張起被 429 打成破圖。⇒ 會誤中的路徑要在 vhost 開獨立 location 只掛 general，
    #   已這樣處理的:conf.d/kawa.homes.conf 的 `location /_next/`。
    map $arg_q $search_limit_key {
        default $binary_remote_addr;
        ''      '';
    }

    # rt / urt 是 scripts/perf-check.sh 想量的東西：沒有它們就只能靠 curl 現場打，
    # 事後無法從 log 回推是哪些請求慢、慢在 nginx 還是 upstream。
    # cf 是 CF-Ray，出事時可以拿去跟 Cloudflare 那邊的紀錄對同一個請求。
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time cf=$http_cf_ray';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # TLS 全域設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Gzip ───────────────────────────────────────────────────────────────
    # 實際生效的其實只有 application/json（backend 沒有 CompressionLayer）：
    #   frontend  Next.js 預設 compress: true，出來已經是 gzip，nginx 不會再壓
    #   media     出的是 WebP，壓了沒用
    # 下面那串其他型別留著是為了「哪天有靜態直出就自動涵蓋」，不是現在有在用。
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    # 預設的 gzip_proxied off 會讓「帶 Via header 的請求」完全不壓。CF 目前不送
    # Via，所以現況沒事，但這是靠上游行為撐著的隱含前提，明確關掉這個條件。
    gzip_proxied any;

    # include 放最後：上面 http 層的設定要能被 conf.d 裡的 server 繼承。
    # （nginx 實際是 parse 完才 merge，順序不影響行為，但寫在後面才不會誤導讀者。）
    include /etc/nginx/conf.d/*.conf;
}