
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 10M;

    # Rate limiting。key 是 $binary_remote_addr，其真實性依賴 conf.d/00-cloudflare-realip.conf
    # 還原出訪客 IP —— 少了那份設定，這裡等於按 CF 節點計費，會誤殺正常流量。
    #
    # general：一般瀏覽。一次頁面載入會併發數十個請求，故 rate 給寬、burst 給大，
    #          只擋明顯洪水，不影響正常使用。
    # auth   ：登入類端點。bcrypt 驗證在 1 核機器上很貴，暴力嘗試同時是爆破與 DoS。
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
    limit_req_status 429;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # TLS 全域設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/*.conf;

    # Gzip 設定
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
}