# kawa.homes 全站編排 — 單一事實來源，所有服務集中此檔
#
# 邊界原則：
# - 本目錄（~/kawa-deploy）由 CI rsync 覆蓋，視為可拋棄，不要在 VPS 上直接改
# - 秘密值與持久資料在 /srv/kawa/，部署永遠不會動到：
#     /srv/kawa/env/      kawa.env(全站唯一 env 檔，三容器共用) / cloudflare.ini
#     /srv/kawa/uploads/  /srv/kawa/torrents/  /srv/kawa/dbdata/
#   範例見 env.example/
#
# ⚠ 改 kawa.env 一行 = 下次部署重建四個容器，即使本檔一個字都沒動。兩段機制疊加：
#     ① compose 把 env_file 的**內容**納入容器配置比對，值變了就算配置變更
#        → database / backend / frontend（這三個掛 env_file）直接 recreate
#     ② 依賴方會跟著被重建 → nginx 自己沒掛 env_file，但 depends_on backend + frontend
#   不受影響的只有 valkey 與 certbot：兩者既不吃 kawa.env，也不 depends_on 任何人。
#   2026-08-01 在 kawa.env 加一行 REDIS_URL 就完整重演了一次（log 裡 database 還走了
#   一輪 Waiting → Healthy）。dbdata 是 bind mount 不會掉，但生產會有一段中斷，而且
#   1 核 1G 上 19 秒內重建四個容器是實打實的資源尖峰 —— 同一次部署的 nginx 冒煙檢查
#   就在那個尖峰上拿到 exit 137（見 .github/workflows/deploy.yml 的冒煙檢查註解）。
#   ⇒ 要動 kawa.env 就當成一次完整部署來安排，不要當作「只是改個設定」。
name: kawa

# ── 日誌 rotation ──────────────────────────────────────────────────────────
# Docker 預設的 json-file 沒有上限，只會單向長大到把小磁碟塞滿。額度依產量分級。
#
# ⚠ 這裡限制的**不是** /admin 觀測頁的日誌 —— 那是 tracing 的 DbLogLayer 直接寫
#   postgres `logs` 表（只收 WARN/ERROR，保留 14 天由 cleanup_observability job 管），
#   與 Docker 無關。這裡管的是 `docker logs` 能往回看多久；backend 是 distroless、
#   exec 不進去，INFO 級訊息只存在這裡，所以額度不要開太小。
x-logging-heavy: &logging-heavy
  # nginx：access_log 走 /dev/stdout（官方 image symlink），每個請求一行，產量最大
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-logging-normal: &logging-normal
  # 應用層：只在啟動、job、錯誤時寫，稀疏
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-logging-quiet: &logging-quiet
  # 幾乎不寫
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "2" }

# ── 資源上限 ────────────────────────────────────────────────────────────────
# 這台是 1 核 1G（+2G swap）。在加上限之前**完全沒有**任何 mem_limit，2026-07-18
# 就發生過整機 OOM、killer 挑中 backend 把它殺掉（見 docs 的事故記錄）。
#
# 加上限的意義是「爆的是單一容器、有明確 log、其他服務活著」，而不是整機被 killer
# 隨機挑一個殺。代價：設太低會讓容器在正常尖峰被 OOM-kill，所以第一版刻意寬鬆。
#
# ⚠ 這些數字是**起步值，不是量測結果**。上線後看 /admin/metrics 的 RSS 曲線再收緊。
#   各上限之和（約 1.2G）刻意略高於實體記憶體 —— mem_limit 是上限不是預留，
#   真正的用途是攔住單一失控的容器。
# ⚠ 刻意不設 memswap_limit：未設時 Docker 允許再用等量 swap，失控的容器會先變慢
#   而不是立刻被殺，在這台機器上是想要的行為（有緩衝時間可以介入）。
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  nginx:
    <<: [*logging-heavy, *hardening]
    image: nginx:alpine
    mem_limit: 64m
    container_name: nginx
    restart: unless-stopped
    stop_signal: SIGTERM
    # 定期 reload 讓 certbot renew 後的新憑證生效
    command: /bin/sh -c "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - letsencrypt:/etc/letsencrypt
      - /srv/kawa/uploads:/srv/kawa/uploads:ro   # media.kawa.homes 直接靜態服務上傳圖(唯讀)
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

  certbot:
    <<: [*logging-quiet, *hardening]
    image: certbot/dns-cloudflare
    mem_limit: 64m
    container_name: certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - /srv/kawa/env/cloudflare.ini:/etc/cloudflare/cloudflare.ini:ro
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

  database:
    <<: [*logging-quiet, *hardening]
    # 預設 shared_buffers 128MB + 每連線 work_mem（pool 上限 20 條）+ WAL buffers，
    # 給足餘裕：這支被 OOM-kill 的代價最高
    mem_limit: 384m
    # PG 18 起官方 image 的 volume 掛載點改為 /var/lib/postgresql（不再是 …/data），
    # 資料目錄由 image 決定為 <mount>/18/docker，未來大版本升級可用 image 的 pg_upgrade 流程
    image: postgres:18-alpine
    container_name: database
    restart: unless-stopped
    volumes:
      - /srv/kawa/dbdata:/var/lib/postgresql
    env_file:
      - /srv/kawa/env/kawa.env   # POSTGRES_PASSWORD
    environment:
      - "POSTGRES_DB=kawa"
      - "POSTGRES_USER=kawa"
      - "PGUSER=kawa"
    healthcheck:
      # CMD-SHELL 只吃一個字串；寫成多元素陣列的話後面那些會變成 sh -c 的位置參數
      # （$0/$1…），不會傳給 pg_isready
      test: ["CMD-SHELL", "pg_isready -d kawa -U kawa"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  valkey:
    <<: [*logging-quiet, *hardening]
    # 刻意不掛 volume：資料全在記憶體，重啟即清空。
    # ⚠ 代價是 member refresh token（TTL 30 天）也會沒了 → valkey 重啟等於把所有會員登出，
    #   需重新登入。其餘 key（權限快取 / oauth state / ws ticket）TTL 短，掉了會自動重算。
    #
    # ⚠ 也**刻意沒有 env_file**，而這正是上面「改 kawa.env 會重建容器」那條的保護傘：
    #   valkey 不吃 kawa.env、也不 depends_on 任何人，所以改 env 的部署不會重建它，
    #   會員不會被登出（2026-08-01 加 REDIS_URL 那次，其他四個容器全重建，只有 valkey
    #   與 certbot 是 Running 沒動）。注意 backend depends_on valkey 是**反方向**、不會
    #   把它拖下水 —— 被依賴方不會因為依賴方重建而重建。
    #   要給 valkey 加任何 env（例如 requirepass）之前先想清楚：那等於把這層保護拿掉，
    #   之後每次改 kawa.env 都會踢掉所有會員。密碼類需求優先用 command 參數或獨立 env 檔。
    image: "valkey/valkey:alpine"
    container_name: valkey
    restart: unless-stopped
    # maxmemory 是這裡真正的防線：資料全在記憶體，refresh token 的 TTL 是 30 天，
    # 會員數成長就是單向長大。volatile-lru 只淘汰有 TTL 的 key（本站所有 key 都有），
    # 額滿時淘汰最久未用的，而不是拒絕寫入。
    command: valkey-server --maxmemory 128mb --maxmemory-policy volatile-lru
    mem_limit: 160m
    ulimits:
      memlock: -1

  backend:
    <<: [*logging-normal, *hardening]
    image: kawagami77/api-server:latest
    # 圖片 decode 的 alloc 上限是 128MB（services/images.rs），尖峰要留得下
    mem_limit: 320m
    container_name: backend
    restart: unless-stopped
    working_dir: /app   # distroless image 無預設 workdir；UPLOAD_PATH 等相對路徑以 /app 為基準
    env_file:
      - /srv/kawa/env/kawa.env
    volumes:
      - /srv/kawa/uploads:/app/uploads
      - /srv/kawa/torrents:/app/torrents
    depends_on:
      database:
        condition: service_healthy
      # AppState 建 redis pool 連不上會直接 panic，所以不能賭 valkey 先起來
      valkey:
        condition: service_started

  frontend:
    <<: [*logging-normal, *hardening]
    image: kawagami77/my-next-blog:latest
    # Next.js standalone + sharp 的圖片最佳化是這台機器上最會吃記憶體的一段
    mem_limit: 320m
    container_name: frontend
    restart: unless-stopped
    stop_grace_period: 1s
    env_file:
      - /srv/kawa/env/kawa.env

volumes:
  letsencrypt:
