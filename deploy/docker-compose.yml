# kawa.homes 全站編排 — 單一事實來源，所有服務集中此檔
#
# 邊界原則：
# - 本目錄（~/kawa-deploy）由 CI rsync 覆蓋，視為可拋棄，不要在 VPS 上直接改
# - 秘密值與持久資料在 /srv/kawa/，部署永遠不會動到：
#     /srv/kawa/env/      kawa.env(全站唯一 env 檔，三容器共用) / cloudflare.ini
#     /srv/kawa/uploads/  /srv/kawa/torrents/  /srv/kawa/dbdata/
#   範例見 env.example/
#
# ⚠ 改 kawa.env 一行 = 下次部署重建四個容器，即使本檔一個字都沒動。兩段機制疊加：
#     ① compose 把 env_file 的**內容**納入容器配置比對，值變了就算配置變更
#        → database / backend / frontend（這三個掛 env_file）直接 recreate
#     ② 依賴方會跟著被重建 → nginx 自己沒掛 env_file，但 depends_on backend + frontend
#   不受影響的只有 valkey 與 certbot：兩者既不吃 kawa.env，也不 depends_on 任何人。
#   2026-08-01 在 kawa.env 加一行 REDIS_URL 就完整重演了一次（log 裡 database 還走了
#   一輪 Waiting → Healthy）。dbdata 是 bind mount 不會掉，但生產會有一段中斷，而且
#   1 核 1G 上 19 秒內重建四個容器是實打實的資源尖峰 —— 同一次部署的 nginx 冒煙檢查
#   就在那個尖峰上拿到 exit 137（見 .github/workflows/deploy.yml 的冒煙檢查註解）。
#   ⇒ 要動 kawa.env 就當成一次完整部署來安排，不要當作「只是改個設定」。
name: kawa

# ── 日誌 rotation ──────────────────────────────────────────────────────────
# Docker 預設的 json-file 沒有上限，只會單向長大到把小磁碟塞滿。額度依產量分級。
#
# ⚠ 這裡限制的**不是** /admin 觀測頁的日誌 —— 那是 tracing 的 DbLogLayer 直接寫
#   postgres `logs` 表（只收 WARN/ERROR，保留 14 天由 cleanup_observability job 管），
#   與 Docker 無關。這裡管的是 `docker logs` 能往回看多久；backend 是 distroless、
#   exec 不進去，INFO 級訊息只存在這裡，所以額度不要開太小。
x-logging-heavy: &logging-heavy
  # nginx：access_log 走 /dev/stdout（官方 image symlink），每個請求一行，產量最大
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-logging-normal: &logging-normal
  # 應用層：只在啟動、job、錯誤時寫，稀疏
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-logging-quiet: &logging-quiet
  # 幾乎不寫
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "2" }

# ── 資源上限 ────────────────────────────────────────────────────────────────
# 這台是 1 核 1G，**沒有 swap**（2026-08-09 實測 `SwapTotal: 0 kB`）。在加上限之前
# 完全沒有任何 mem_limit，2026-07-18 就發生過整機 OOM、killer 挑中 backend 把它殺掉。
#
# ⚠ 這行以前寫「1 核 1G（+2G swap）」，是錯的 —— `deploy/README.md` 的**換機** runbook
#   有「開 swap」那一步，但現行這台從來沒做過，註解照著 runbook 假設了沒發生的事。
#   要加的話見 README 那節（磁碟只剩約 8.6G 且 torrent 還在寫，開 1G 就好、別開 2G）。
#
# 加上限的意義是「爆的是單一容器、有明確 log、其他服務活著」，而不是整機被 killer
# 隨機挑一個殺。代價：設太低會讓容器在正常尖峰被 OOM-kill，所以第一版刻意寬鬆。
#
# ⚠ 各上限之和（約 1.4G）刻意高於實體記憶體 —— mem_limit 是上限不是預留，
#   真正的用途是攔住單一失控的容器。**調低不會多出任何可用記憶體。**
# ⚠ 設太低不一定會 OOM-kill，可能變成**永不結束的活鎖** —— 見 certbot 那段的事故。
#   容器撞到 mem_limit 時 kernel 先做回收，回收「勉強成功」就不觸發 OOM killer：
#   沒有 exit code、沒有 log、沒有 restart，只有整機 load +1.0 與 TB 級的 BLOCK 讀取。
#   ⇒ 排查無聲的資源異常，`docker stats` 的 MEM%（貼著 100% 就是這個）與 BLOCK I/O
#     比 log 更早說實話。
# ⚠ 刻意不設 memswap_limit，但**理由已經換過一次，別再改回舊版**：
#   最早寫「未設時 Docker 允許再用等量 swap」→ 錯，kernel 沒開 swap accounting
#   （`docker update --memory-swap` 回 "Your kernel does not support swap limit
#   capabilities"），Docker 對 swap 根本沒有任何限制。改寫時留了一句「結論（失控的
#   容器會先變慢而不是立刻被殺）碰巧仍成立」—— **那句在 0 swap 下也是錯的**，沒有
#   swap 就沒有「先變慢」那一段，撞到上限就是回收活鎖或直接被殺。
#   ⇒ 現況下不設 memswap_limit 純粹是因為設了也無效。哪天真的開了 swap，要靠它擋
#     容器仍得先在 kernel cmdline 開 `swapaccount=1`。
#
# ── 實測值（2026-08-09，`docker stats --no-stream`；穩態、非尖峰）────────────
#   frontend 179.5M/320m(56%)  database 113.2M/384m(29%)  certbot 16.7M/256m(7%)
#   backend   15.4M/320m(4.8%) nginx      7.1M/64m(11%)   valkey    4.9M/160m(3%)
#   容器合計約 337M；host（dockerd/containerd/sshd/systemd）另約 99M。
#   整機 MemTotal-MemAvailable 約 684M（69%），比容器合計高的部分主要是
#   `Shmem` 約 82M（PG shared_buffers，算在 Cached 裡但 0 swap 下回收不掉）。
#   /admin/metrics 的 7 天曲線：mem_used 568–748M 上下震盪、無單調爬升＝穩態不是洩漏。
#   ⇒ 結論：這組上限**不需要收緊**（見上面「調低不會多出可用記憶體」）。真正該補的是 swap。
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  nginx:
    <<: [*logging-heavy, *hardening]
    image: nginx:alpine
    mem_limit: 64m
    container_name: nginx
    restart: unless-stopped
    stop_signal: SIGTERM
    # 定期 reload 讓 certbot renew 後的新憑證生效
    command: /bin/sh -c "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - letsencrypt:/etc/letsencrypt
      - /srv/kawa/uploads:/srv/kawa/uploads:ro   # media.kawa.homes 直接靜態服務上傳圖(唯讀)
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

  certbot:
    <<: [*logging-quiet, *hardening]
    image: certbot/dns-cloudflare
    # ⚠ 這裡曾經是 64m —— 太低,而且症狀完全不像記憶體問題。2026-08-03 17:18Z 憑證進入
    # 續期窗口(到期前 30 天),renew 第一次真的做事(載入 cryptography + DNS-01 challenge)
    # 就撞上 64m 天花板,然後**活鎖 12 小時**:cgroup 回收每次都勉強成功 → 不觸發 OOM
    # killer(`oom=false`、`restarts=0`、`--quiet` 故 log 全空)→ 沒有任何錯誤訊號,只有
    # 整機 load 憑空 +1.0、cpu 從 ~43% 跳到 ~89%,以及 `docker stats` 上 19.3TB 的 BLOCK
    # 讀取(其他容器都是 GB 級)。在窗口外 renew 是幾秒結束的 no-op,所以這個上限撐了三天
    # 才爆 —— 「跑很久都沒事」不代表額度夠。
    # ⇒ 判讀提示:certbot 沒 log + 整機 load 釘死 1.0,先看 `docker stats` 的 BLOCK I/O。
    mem_limit: 256m
    container_name: certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - /srv/kawa/env/cloudflare.ini:/etc/cloudflare/cloudflare.ini:ro
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

  database:
    <<: [*logging-quiet, *hardening]
    # 預設 shared_buffers 128MB + 每連線 work_mem（pool 上限 20 條）+ WAL buffers，
    # 給足餘裕：這支被 OOM-kill 的代價最高
    mem_limit: 384m
    # PG 18 起官方 image 的 volume 掛載點改為 /var/lib/postgresql（不再是 …/data），
    # 資料目錄由 image 決定為 <mount>/18/docker，未來大版本升級可用 image 的 pg_upgrade 流程
    image: postgres:18-alpine
    container_name: database
    restart: unless-stopped
    volumes:
      - /srv/kawa/dbdata:/var/lib/postgresql
    env_file:
      - /srv/kawa/env/kawa.env   # POSTGRES_PASSWORD
    environment:
      - "POSTGRES_DB=kawa"
      - "POSTGRES_USER=kawa"
      - "PGUSER=kawa"
    healthcheck:
      # CMD-SHELL 只吃一個字串；寫成多元素陣列的話後面那些會變成 sh -c 的位置參數
      # （$0/$1…），不會傳給 pg_isready
      test: ["CMD-SHELL", "pg_isready -d kawa -U kawa"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  valkey:
    <<: [*logging-quiet, *hardening]
    # 刻意不掛 volume：資料全在記憶體，重啟即清空。
    # ⚠ 代價是 member refresh token（TTL 30 天）也會沒了 → valkey 重啟等於把所有會員登出，
    #   需重新登入。其餘 key（權限快取 / oauth state / ws ticket）TTL 短，掉了會自動重算。
    #
    # ⚠ 也**刻意沒有 env_file**，而這正是上面「改 kawa.env 會重建容器」那條的保護傘：
    #   valkey 不吃 kawa.env、也不 depends_on 任何人，所以改 env 的部署不會重建它，
    #   會員不會被登出（2026-08-01 加 REDIS_URL 那次，其他四個容器全重建，只有 valkey
    #   與 certbot 是 Running 沒動）。注意 backend depends_on valkey 是**反方向**、不會
    #   把它拖下水 —— 被依賴方不會因為依賴方重建而重建。
    #   要給 valkey 加任何 env（例如 requirepass）之前先想清楚：那等於把這層保護拿掉，
    #   之後每次改 kawa.env 都會踢掉所有會員。密碼類需求優先用 command 參數或獨立 env 檔。
    image: "valkey/valkey:alpine"
    container_name: valkey
    restart: unless-stopped
    # maxmemory 是這裡真正的防線：資料全在記憶體，refresh token 的 TTL 是 30 天，
    # 會員數成長就是單向長大。volatile-lru 只淘汰有 TTL 的 key（本站所有 key 都有），
    # 額滿時淘汰最久未用的，而不是拒絕寫入。
    command: valkey-server --maxmemory 128mb --maxmemory-policy volatile-lru
    mem_limit: 160m
    ulimits:
      memlock: -1

  backend:
    <<: [*logging-normal, *hardening]
    image: kawagami77/api-server:latest
    # 圖片 decode 的 alloc 上限是 128MB（services/images.rs），尖峰要留得下
    mem_limit: 320m
    container_name: backend
    restart: unless-stopped
    # 關掉容器內的 IPv6。
    #
    # ⚠ **這兩行本身不是解法，實測沒有修好任何東西** —— 2026-08-09 加上去、容器在
    # 07:51:34 帶著它重建，07:53:37 同一個錯誤照樣發生，訊息逐字相同。記在這裡是為了
    # 讓下一個人不要重走一遍。
    #
    # 真正的根因在**宿主機**：這台 VPS 從來沒有可用的 IPv6（`ip -6 addr` 只有 link-local
    # `fe80::`、`ip -6 route` 沒有 `::/0`），但 IPv6 stack 開著，於是 glibc 與 Go 都以為
    # 「有 IPv6」，對外連線先試 AAAA 再撞牆：
    #   08-05 lettre   → smtp.gmail.com        政府標案通知信沒寄出（EADDRNOTAVAIL）
    #   08-06 lettre   → smtp.gmail.com        torrent 完成通知信沒寄出（同上）
    #   08-09 reqwest  → www.googleapis.com    member 用 Google 登入失敗，回 502（同上）
    #   08-09 dockerd  → auth.docker.io        `docker pull` 失敗（ENETUNREACH）——
    #                                          這行證明問題在宿主機，不在任何容器裡
    # 部署腳本第一行就是 `docker pull`，所以這個問題也會讓部署紅燈。
    #
    # ⇒ 宿主機要關 IPv6（`/etc/sysctl.d/99-disable-ipv6.conf`）。**關之前必須先拆掉
    #   nginx 的 `listen [::]`**，否則 nginx 起不來、全站掛掉（見 nginx/conf.d/01-default-server.conf）。
    #
    # 這兩行留著的理由只剩「這個 netns 的 IPv6 確實不可用，關掉是正確的衛生」。
    # 宿主機關掉之後它們就是多餘的，但無害，也擋得住宿主機設定被還原的情況。
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    working_dir: /app   # distroless image 無預設 workdir；UPLOAD_PATH 等相對路徑以 /app 為基準
    env_file:
      - /srv/kawa/env/kawa.env
    volumes:
      - /srv/kawa/uploads:/app/uploads
      - /srv/kawa/torrents:/app/torrents
    depends_on:
      database:
        condition: service_healthy
      # AppState 建 redis pool 連不上會直接 panic，所以不能賭 valkey 先起來
      valkey:
        condition: service_started

  frontend:
    <<: [*logging-normal, *hardening]
    image: kawagami77/my-next-blog:latest
    # Next.js standalone + sharp 的圖片最佳化是這台機器上最會吃記憶體的一段
    mem_limit: 320m
    container_name: frontend
    restart: unless-stopped
    stop_grace_period: 1s
    env_file:
      - /srv/kawa/env/kawa.env

volumes:
  letsencrypt:
