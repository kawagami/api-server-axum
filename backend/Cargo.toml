[package]
name = "api-server-axum"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8", features = ["tracing", "multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = [
    "fs",
    "timeout",
    "trace",
    "cors",
    "limit",
    # handler panic → 500 + ERROR log（見 errors.rs::handle_panic）
    "catch-panic",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "rust_decimal",
    "json",
] }
dotenvy = "0.15.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.34", features = ["serde"] }
futures = "0.3.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# v10 起改用 trait 抽象 crypto backend，必須自己挑一個，否則沒有 provider 可用。
# 挑 aws_lc_rs：aws-lc-sys 早已被 librqbit 的 sha1-ring 拉進來編（cmake 也已在 Dockerfile），
# 等於零新增 C 依賴；rust_crypto 反而會多帶 p256/p384/ed25519-dalek/rsa 等 16 個用不到的 crate。
# default-features = false 砍掉 use_pem —— 全案只用 from_secret 簽驗 HS256，不碰 PEM。
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
bcrypt = "0.19.2"
bb8 = "0.9"
bb8-redis = "0.26"
redis = "1.0"
rand = "0.9"
tokio-cron-scheduler = "0.15"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1.0"
regex = "1"
form_urlencoded = "1.2.1"
rust_decimal = { version = "1", features = ["serde"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
zhconv = "0.4.1"
# `pool`：讓 AsyncSmtpTransport 保留連線重用。沒有它時每封信都是一次完整的
# TCP + STARTTLS + AUTH 握手 —— 中獎通知是「一個 member 一封」的迴圈，握手成本會乘上人數。
# 只多拉 futures-util（axum / bb8 / futures 已各自拉進來），無新增 crate。搭配 services/email.rs 的
# transport 快取才有效：transport 每次重建等於連線池每次重建，等於沒有池。
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname", "pool"] }
libc = "0.2"
librqbit = { version = "8", default-features = false, features = ["rust-tls"] }
tower = { version = "0.5", features = ["util"] }
wana_kana = "5.0.0"
unicode-normalization = "0.1.25"
# 圖片上傳處理：image 負責 decode 驗證，webp（libwebp/C，靜態連結）負責 lossy 編碼
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
webp = { version = "0.3.1", default-features = false }
# passkey 登入：danger-allow-state-serialisation 讓挑戰狀態可序列化存 Redis（server 端一次性消費，無 client 重放面）；
# conditional-ui 提供 discoverable authentication（登入頁 autofill 免輸帳號）
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
# ResidentKeyRequirement 等 wire 型別不在 webauthn-rs prelude，需直接引 proto crate（版本跟 webauthn-rs 對齊）
webauthn-rs-proto = "0.5"
# webauthn-rs 硬依賴 OpenSSL ≥3.0；vendored = 隨原始碼編譯靜態連結，不吃系統版本
# （本機 WSL 是 1.1.1、distroless 也免帶 runtime libssl；builder 已有 perl/make/gcc）
openssl = { version = "0.10", features = ["vendored"] }
